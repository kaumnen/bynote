# Manual production deploy to Cloudflare Workers.
#
# Keep these constraints. Do not add push, pull_request, pull_request_target,
# workflow_call, or workflow_run triggers — those are how forks and untrusted
# PRs get access to deploy credentials.
#
# Credentials are environment secrets on `production` (not repo secrets), and
# that environment is restricted to `main`. A workflow copy on another branch
# or in a fork cannot read them.
#
# Required `production` environment secrets:
#   CLOUDFLARE_API_TOKEN    "Edit Cloudflare Workers" token, one account only
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'kaumnen/bynote' &&
      github.ref == 'refs/heads/main' &&
      !github.event.repository.fork &&
      github.actor == github.repository_owner
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Missing production environment secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          bunx wrangler deploy
